[project]
name = "flakehunter"
version = "0.1.0"
description = "Agent that finds flaky CI tests, proves why they break, and opens a PR to fix them. Built on Exasol Personal + LangGraph."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "langchain-anthropic>=1.7.2",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2.11",
    "pyexasol>=2.4.0",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
]

[project.scripts]
flakehunter = "flakehunter.cli:main"
